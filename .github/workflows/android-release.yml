name: Build and Release Android APK

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Use npm instead of pnpm for Android builds.
      # React Native's Gradle toolchain requires a flat node_modules
      # layout without symlinks. pnpm's .pnpm virtual store breaks
      # Gradle plugin resolution (expo-module-gradle-plugin, etc.)
      # even with node-linker=hoisted.
      - name: Install dependencies (npm for flat node_modules)
        run: npm install --legacy-peer-deps

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk chapter-app-release.apk

      - name: VirusTotal Scan
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: chapter-app-release.apk

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: chapter-app-release.apk
