name: Build and Release Android APK

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean

      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          ls -la apps/mobile/android/app/build/outputs/apk/release/
          mv apps/mobile/android/app/build/outputs/apk/release/*.apk chapter-app-release.apk

      - name: VirusTotal Scan
        uses: crazy-max/ghaction-virustotal@v4
        continue-on-error: true
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: chapter-app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chapter-app-release
          path: chapter-app-release.apk

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: chapter-app-release.apk
