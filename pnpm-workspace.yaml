packages:
  - "packages/*"
  - "apps/*"
  - "server"

# esbuild links a platform binary in its install script; vitest needs it.
allowBuilds:
  better-sqlite3: true
  esbuild: true

patchedDependencies:
  '@sqlite.org/sqlite-wasm': patches/@sqlite.org__sqlite-wasm.patch
  react-native: patches/react-native.patch
  libsodium: patches/libsodium.patch
  expo: patches/expo.patch
